name: Refresh YouTube Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  refresh-feed:
    name: Refresh and Validate YouTube Feed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          pytest tests/ -v

      - name: Fetch and generate YouTube Shorts feed
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python scripts/fetch_youtube_feed.py

      - name: Commit and push changes if feed updated
        run: |
          if git diff --quiet data/youtube_feed.json; then
            echo "Feed data is unchanged. No commit needed."
          else
            echo "Feed updated. Committing changes..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/youtube_feed.json
            git commit -m "chore(feed): update quran youtube shorts feed [skip ci]"
            git push
          fi
