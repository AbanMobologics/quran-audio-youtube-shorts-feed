name: Deploy YouTube Feed to GitHub Pages

on:
  workflow_run:
    workflows:
      - "Refresh YouTube Feed"
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - "data/youtube_feed.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-pages:
    name: Deploy Feed to GitHub Pages
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages Staging Directory
        run: |
          mkdir -p public
          cp data/youtube_feed.json public/youtube_feed.json
          cat << 'EOF' > public/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Quran YouTube Shorts Feed</title>
            <style>
              body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                margin: 0;
                padding: 40px 20px;
                background: #0f172a;
                color: #f8fafc;
                display: flex;
                flex-direction: column;
                align-items: center;
              }
              .card {
                background: #1e293b;
                border: 1px solid #334155;
                border-radius: 12px;
                padding: 32px;
                max-width: 600px;
                width: 100%;
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
              }
              h1 { margin-top: 0; font-size: 1.6rem; color: #38bdf8; }
              p { color: #94a3b8; line-height: 1.6; }
              .badge {
                display: inline-block;
                background: #0284c7;
                color: #ffffff;
                font-size: 0.75rem;
                font-weight: 600;
                padding: 4px 10px;
                border-radius: 9999px;
                margin-bottom: 16px;
              }
              a.btn {
                display: inline-block;
                margin-top: 16px;
                background: #0284c7;
                color: white;
                text-decoration: none;
                font-weight: 500;
                padding: 10px 20px;
                border-radius: 8px;
                transition: background 0.2s;
              }
              a.btn:hover { background: #0369a1; }
              code {
                background: #0f172a;
                color: #38bdf8;
                padding: 2px 6px;
                border-radius: 4px;
                font-size: 0.9em;
              }
            </style>
          </head>
          <body>
            <div class="card">
              <span class="badge">Active Pipeline</span>
              <h1>Quran YouTube Shorts Feed</h1>
              <p>This endpoint delivers a validated, statically hosted HTTPS JSON feed for the Quran application's YouTube Shorts player.</p>
              <p>Direct feed endpoint: <code>/youtube_feed.json</code></p>
              <a class="btn" href="youtube_feed.json" target="_blank" rel="noopener noreferrer">View JSON Feed</a>
            </div>
          </body>
          </html>
          EOF

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
